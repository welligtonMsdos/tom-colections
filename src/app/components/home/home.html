<div class="container">

  <div class="row">

    <div class="col-12 mt-5">

      <div class="card shadow-lg">

        <div class="card-body">

          @if (loginService.currentUser(); as user) {

            @if(user.email) {

              <header>
                <h5>Olá, {{ user.name }}!</h5>               
              </header>            

            }

          } @else {

             <div class="alert text-warning alert-warning border-warning border-2 mb-2 p-2 shadow-sm" role="alert">

                <div class="flex items-center">

                  <i class="pi pi-exclamation-triangle me-2"></i>

                  <span class="text-xs font-bold uppercase">Por favor, faça login para acessar recursos adicionais.</span>

                </div>

             </div>

          }        

          <div class="d-flex gap-2">

            <button class="btn btn-primary" routerLink="/vinyl"> 
              <i class="pi pi-play"></i>
              LPs
            </button>

            <button class="btn btn-primary" routerLink="/k7">
              <i class="pi pi-play"></i>
              K7s
            </button>

          </div>

        </div>          

      </div>

    </div>

  </div>

</div>
