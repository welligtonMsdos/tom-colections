<div class="container">

  <div class="row">

    <div class="col-12 mt-5">

      <div class="card shadow-lg">

        <div class="card-body">

          @if (loginService.currentUser(); as user) {

            @if(user.email) {               
              
              <div class="d-flex gap-2">
           
                <button color="primary" 
                        routerLink="/vinyl" 
                        class="btn btn-primary action-tile rounded-3 d-flex flex-column align-items-center justify-content-center p-3 shadow-sm">
                    <mat-icon class="tile-icon mb-1">album</mat-icon>
                    <span class="tile-label font-semibold">LPs</span>
                </button>

                <button color="primary" 
                        routerLink="/k7" 
                        class="btn btn-primary action-tile rounded-3 d-flex flex-column align-items-center justify-content-center p-3 shadow-sm">
                    <mat-icon class="tile-icon mb-1">graphic_eq</mat-icon>
                    <span class="tile-label font-semibold">K7s</span>
                </button>            

              </div>

            }

          } @else {

             <div class="alert text-warning alert-warning border-warning border-2 mb-2 p-2 shadow-sm" role="alert">

                <div class="flex items-center">

                  <i class="pi pi-exclamation-triangle me-2"></i>

                  <span class="text-xs font-bold uppercase">Por favor, faça login para acessar recursos adicionais.</span>

                </div>

             </div>

          }        

        

        </div>          

      </div>

    </div>

  </div>

</div>
