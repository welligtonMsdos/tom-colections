<main class="auth-page container d-flex align-items-center py-3">
  <div class="col-12 col-md-10 col-lg-8 col-xl-6 mx-auto">
    @if (isLoginMode()) {
    <app-auth-login class="d-block" (toggle)="toggleMode()" />
    } @else {
    <app-auth-signup class="d-block" (toggle)="toggleMode()" />
    }
  </div>
</main>
