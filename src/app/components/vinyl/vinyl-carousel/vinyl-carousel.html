<section
  class="vinyl-carousel"
  role="region"
  aria-roledescription="carrossel"
  aria-label="Álbuns de vinil"
  (keydown)="onKeydown($event)"
>
  @if (albums.length > 0) {
    <div
      class="vinyl-carousel__stage"
      [class.vinyl-carousel__stage--dragging]="dragOffset !== 0"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="cancelGesture()"
      (lostpointercapture)="onLostPointerCapture($event)"
    >
      @for (album of albums; track album.guid; let index = $index) {
        <button
          type="button"
          class="vinyl-carousel__album"
          [class.vinyl-carousel__album--active]="index === activeIndex"
          [class.vinyl-carousel__album--distant]="!isNearby(index)"
          [style.transform]="itemTransform(index)"
          [style.z-index]="index === activeIndex ? 3 : 1"
          [attr.tabindex]="isNearby(index) ? 0 : -1"
          [attr.aria-hidden]="!isNearby(index) ? 'true' : null"
          [attr.aria-label]="'Álbum ' + (index + 1) + ' de ' + albums.length + ', identificador ' + album.guid"
          [attr.aria-pressed]="index === activeIndex"
          (click)="onAlbumClick(index, $event)"
        >
          <span
            class="vinyl-carousel__disc"
            aria-hidden="true"
          >
            <span
              class="vinyl-carousel__label"
            >
              @if (hasPhoto(album)) {
                <img
                  [src]="photoUrl(album)"
                  alt=""
                  draggable="false"
                  (error)="photoFailed(album)"
                />
              }
            </span>
          </span>
          <span
            class="vinyl-carousel__cover shadow"
            aria-hidden="true"
          >
            @if (hasPhoto(album)) {
              <img
                [src]="photoUrl(album)"
                alt=""
                draggable="false"
                (error)="photoFailed(album)"
              />
            } @else {
              <span
                class="d-flex flex-column align-items-center justify-content-center gap-2 h-100 text-secondary"
              >
                <i
                  class="pi pi-image fs-1"
                >
                </i>
                Capa indisponível
              </span>
            }
          </span>
        </button>
      }
    </div>
    <div
      class="d-flex align-items-center justify-content-center gap-3 pb-3"
    >
      <button
        type="button"
        class="btn btn-outline-primary"
        aria-label="Álbum anterior"
        [disabled]="activeIndex === 0"
        (click)="select(activeIndex - 1)"
      >
        <i
          class="pi pi-chevron-left"
          aria-hidden="true"
        >
        </i>
      </button>
      <span
        class="text-secondary small"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        Álbum {{ activeIndex + 1 }} de {{ albums.length }}
      </span>
      <button
        type="button"
        class="btn btn-outline-primary"
        aria-label="Próximo álbum"
        [disabled]="activeIndex === albums.length - 1"
        (click)="select(activeIndex + 1)"
      >
        <i
          class="pi pi-chevron-right"
          aria-hidden="true"
        >
        </i>
      </button>
    </div>
  } @else {
    <p
      class="text-secondary text-center py-5 mb-0"
      role="status"
    >
      Nenhum álbum disponível.
    </p>
  }
</section>
