<section class="collection-summary" aria-label="Resumo da coleção de LPs">
  <div class="collection-summary__icon"><mat-icon aria-hidden="true">album</mat-icon></div>
  <div class="collection-summary__title"><span>Acervo atual</span><strong>{{ vinylService.totalQuantity() }} {{ vinylService.totalQuantity() === 1 ? 'LP' : 'LPs' }}</strong></div>
  <div class="collection-summary__value"><span>Valor estimado</span><strong>{{ vinylService.totalValue() | currency:'BRL' }}</strong></div>
</section>
