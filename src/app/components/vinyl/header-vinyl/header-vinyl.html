<section class="catalog-toolbar" aria-label="Ferramentas do catálogo">
  <div class="catalog-toolbar__heading">
    <span class="catalog-toolbar__kicker">Catálogo</span>
    <h2>Seus discos</h2>
  </div>

  <div class="catalog-toolbar__actions">
    <label class="search-field" for="vinyl-search">
      <i class="pi pi-search" aria-hidden="true"></i>
      <input id="vinyl-search" type="search" placeholder="Buscar artista ou álbum" [value]="searchTerm()" (input)="updateSearch($any($event.target).value)" />
      @if (searchTerm()) { <button type="button" (click)="updateSearch('')" aria-label="Limpar busca"><i class="pi pi-times"></i></button> }
    </label>
    <button class="create-button" type="button" (click)="showModalCreate.set(true)"><i class="pi pi-plus" aria-hidden="true"></i><span>Novo LP</span></button>
  </div>
</section>

@if (showModalCreate()) { <app-vinyl-create (close)="showModalCreate.set(false)" /> }
