<div class="row g-3 mb-3 p-3 mt-3">
  <div class="col-md-12">  
    <div class="d-flex align-items-center justify-content-between gap-3">    
      
      <div class="position-relative col-md-4">
        <input 
          type="text" 
          class="form-control ps-5" 
          placeholder="Buscar por artista ou álbum..."
          [value]="searchTerm()"
          (input)="updateSearch($any($event.target).value)">
        <i class="pi pi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
      </div>

      <div class="ms-auto">
        <button class="btn btn-primary" (click)="showModalCreate.set(true)">
          <i class="pi pi-plus me-2"></i>
          Novo LP
        </button>
      </div>

    </div>
  </div>
</div>

@if (showModalCreate()) {
  <app-vinyl-create (close)="showModalCreate.set(false)" />
}
