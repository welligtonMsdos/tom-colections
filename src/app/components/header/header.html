<mat-toolbar
  class="overflow-x-auto"
>
  <button mat-button routerLink="/home">
    <i class="pi pi-home"></i>
    Home
  </button>  

  <button mat-button routerLink="/dashboard">
    <i class="pi pi-chart-bar"></i>
    Dashboard
  </button> 
  
  <button mat-button routerLink="/profile">
    <i class="pi pi-user"></i>
    Perfil
  </button>

  <span class="spacer"></span>

  <button
    class="mr-2 flex transition-transform hover:scale-125 align-middle"
    mat-icon-button
    aria-label="Logout"
    (click)="logout()"
  >
    <span class="material-icons text-white">logout</span>
  </button>

  <button
    class="mr-2 flex transition-transform hover:scale-125 align-middle"
    mat-icon-button
    aria-label="Settings"
    (click)="themeService.toggleTheme()"
  >
    @if (themeService.darkMode()) {
    <span class="material-icons text-white">dark_mode</span>
    } @else {
    <span class="material-icons text-white">light_mode</span>
    }
  </button>
</mat-toolbar>
